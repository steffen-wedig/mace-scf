[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mace_scf"
dynamic = ["version"]

[project.scripts]
mace-scf-train = "mace_scf.cli.run_train:main"
mace-scf-predict = "mace_scf.cli.predict:main"

[tool.setuptools.dynamic]
version = {attr = "mace_scf.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["mace_scf", "mace_scf.*"]
